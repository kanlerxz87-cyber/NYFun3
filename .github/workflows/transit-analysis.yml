name: Transit analysis

on:
  push:
    branches:
      - arena/67e5a326-nyfun3
    paths:
      - research/scripts/transit_analysis.py
      - .github/workflows/transit-analysis.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transit-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3

      - name: Compute subway access analysis from official sources
        run: python research/scripts/transit_analysis.py

      - name: Commit results on the same branch
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit.json research/generated/transit_analysis.json
          if git diff --staged --quiet; then
            echo "No transit analysis change to commit."
          else
            git commit -m "Compute starred-restaurant subway access from GTFS + Census geocoder for run $RUN_ID [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          fi

      - name: Upload structured analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-analysis
          path: |
            data/transit.json
            research/generated/transit_analysis.json
          if-no-files-found: warn
          retention-days: 7
