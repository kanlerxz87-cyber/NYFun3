name: Research diagnostics

on:
  push:
    branches:
      - arena/ed92e764-nyfun3
    paths:
      - research/scripts/diagnose.py
      - .github/workflows/research-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the fixed session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch official-source diagnostics
        run: python research/scripts/diagnose.py

      - name: Upload structured diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-diagnostics
          path: research/generated/diagnostics.json
          if-no-files-found: warn
          retention-days: 7
